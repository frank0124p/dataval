name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Rule lint
        run: python rules.py lint
      - name: Checking verb tests
        run: python tests/checking_verbs_test.py
      - name: Architecture tests
        run: python tests/architecture_test.py
      - name: Golden tests
        run: python tests/golden_test.py
      - name: Syntax check
        run: python -m compileall -q dataval config/skills_py tests run.py rules.py merge_advisory.py
