#       不想追了 → 改為 deferred。只有 answered 計入收斂與下一輪 prompt。
# structural 條目請先手動修改權威輸入（input/subscription/ 的 .sql／relations.yaml／context.md）再改 answered，並確認 applied_to。
version: 1
iteration: 2
answers:
  - id: NAME.SEMANTIC@subscription.MonthlyPrice
    question: "MonthlyPrice 除了命名風格（閘門已列）之外，語意上也看不出幣別與含稅狀態——訂閱可能跨幣別販售嗎？若可能，是否缺一個 currency 欄位；若固定單一幣別，這個前提記載在哪裡？"
    answer: "訂閱目前僅以 TWD 計價，暫不加 currency 欄位；此前提補記於 context.md 的「這個 data subject 是什麼」段落，未來跨幣別販售時再增欄。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@billing_event.amount
    question: "amount 的正負語意是什麼——退款、調整是以負值表達，還是另有事件種類區分？下游對帳加總時是否可以直接 SUM(amount)？"
    answer: "amount 一律為正值，扣款／退款以未來的 event_type 欄位區分；在補上 event_type 之前，下游不應直接 SUM(amount)。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@dim_customer
    question: "三張表的命名慣例不一致：dim_customer 帶維度前綴、subscription 與 billing_event 沒有分層前綴——這是刻意的嗎？之後晉升到 production 時，要不要統一「維度表 dim_、事實／事件表不加前綴」之類的慣例並登錄到 naming 詞彙？"
    answer: "統一採「維度表 dim_ 前綴、事實與事件表不加前綴」慣例，並登錄到 config/Common/naming 詞彙字典；本 subject 現有表名維持不變。"
    kind: semantic
    status: answered
  - id: CONCEPT.SUBJECT@subscription
    question: "一行代表「一筆訂閱（含歷史訂閱）」，但表上只有 started_at——訂閱的生命週期（生效中／已取消／已到期）與結束時間如何表達？沒有 status 或 ended_at 時，「目前有效訂閱數」這種基本指標要怎麼算？"
    answer: "在 subscription 表增加 status（active/cancelled/expired）與 ended_at（Nullable）兩欄，由訂閱服務維護生命週期。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: CONCEPT.SUBJECT@billing_event
    question: "計費事件只掛 customer_id、沒有 subscription_id——同一客戶有多筆訂閱時，一次計費事件要如何歸屬到特定訂閱？「訂閱營收分析」這個用途是否其實需要訂閱粒度的歸屬？"
    answer: "在 billing_event 增加 subscription_id 欄位並於 relations.yaml 宣告對 subscription 的 N:1 關聯，讓計費事件可歸屬到單筆訂閱。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: CONCEPT.SUBJECT@dim_customer
    question: "客戶主檔權威在 CRM，本 subject 又建了一張 dim_customer——它的定位是 CRM 主檔的同步副本（只讀、欄位子集）還是新的權威？若是副本，同步頻率與允許滯後記載在哪裡？"
    answer: "dim_customer 定位為 CRM 客戶主檔的只讀同步副本（日批），僅保留分析需要的欄位子集；此定位與同步頻率補記於 context.md 上下游段落。"
    kind: semantic
    status: answered
  - id: SKILL.best_practice_semantic@billing_event
    question: "billing_event 是事件表，但沒有 event_type——扣款、退款、方案調整都混在同一種事件裡嗎？事件表的最佳實踐通常需要事件種類欄位，這裡是刻意省略還是尚未設計？"
    answer: "增加 event_type（LowCardinality(String)：charge/refund/adjustment）欄位，於寫入端強制枚舉值。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.best_practice_semantic@subscription
    question: "subscription 表有 created_at 但沒有 updated_at，dim_customer 兩者皆有——訂閱資料（例如未來的狀態變更）會就地更新嗎？若會，缺 updated_at 是否影響增量同步與稽核？"
    answer: "為 subscription 補上 updated_at 稽核欄位，與 dim_customer 的稽核欄位慣例對齊。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.naming_semantic@billing_event.occurred_at
    question: "subscription 用 started_at、billing_event 用 occurred_at、兩表又都有 created_at——這三種時間的語意分工（業務發生 vs 資料寫入）是否已明文化，確保營收分析一律以 occurred_at 彙總？"
    answer: "約定：occurred_at／started_at 為業務發生時間（分析用），created_at 為資料寫入時間（稽核用）；登錄到 naming 詞彙字典。"
    kind: semantic
    status: answered
  - id: SKILL.ssot_semantic@subscription.MonthlyPrice
    question: "MonthlyPrice（訂閱月費）與 billing_event.amount（實際計費金額）之間的權威關係是什麼——月費調整後歷史事件金額不變？對帳時發現兩者不一致，以哪邊為準？"
    answer: "billing_event.amount 是實際請款的權威（事件快照）；MonthlyPrice 僅是目前定價，兩者允許不一致；營收一律以 billing_event 加總。此邊界登錄到 SSOT 文件。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@subscription.MonthlyPrice / billing_event.amount
    question: "兩個金額欄一個叫 `price`、一個叫 `amount`——它們是同一條金流的兩個階段（應收 vs 實收），還是各自獨立的事實？從欄名分不出來。"
    answer: "是同一條金流的兩個階段：`monthly_price` 是應收的合約定價，`amount` 是該次計費實際發生的金額。建議在 context.md 明寫這組對應關係，作為對帳口徑。"
    kind: semantic
    status: answered
  - id: SKILL.best_practice_semantic@dim_customer
    question: "維度表帶了 `updated_at` 卻沒有版本或有效區間欄——客戶分級變動時，是直接覆寫舊值嗎？覆寫後過去的訂閱分析還能還原當時的分級嗎？"
    answer: "目前為覆寫式（Type 1），可接受；若訂閱營收需要按「簽約當時分級」拆解，改以在事實表快照分級（Type 2 的輕量替代）處理，不建議整張表改成 Type 2。"
    kind: semantic
    status: answered
  - id: SKILL.naming_semantic@subscription.customer_id / dim_customer.customer_id / billing_event.customer_id
    question: "三張表都有 `customer_id`，指的確定是同一個客戶實體嗎？如果是，它們的編碼是否同源（同一份號碼、同一種格式）？"
    answer: "三者都是 CRM 客戶主檔的同一份客戶編號、同源。`subscription.customer_id` 目前的型別與另外兩張表不一致，應統一為與 `dim_customer.customer_id` 相同的整數型別。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.naming_semantic@subscription.started_at / subscription.created_at
    question: "`started_at`（訂閱生效）與 `created_at`（資料建立）兩個時間欄命名形式相同——分析師要算訂閱起始時，看得出該用哪一個嗎？"
    answer: "`started_at` 是業務生效時間（所有訂閱期間分析一律用它），`created_at` 僅供稽核與增量抽取。建議補上 COMMENT 並寫進 context.md。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.ssot_semantic@subscription.customer_email
    question: "客戶 email 同時存在 `dim_customer` 與 `subscription` 兩張表——當客戶更新 email 時，兩邊會同時更新嗎？如果不會，哪一邊才是對外可信的那份？"
    answer: "權威在客戶主檔（CRM → `dim_customer.customer_email`）。`subscription.customer_email` 屬於重複承載，應移除；若是為了保留「訂閱當下的聯絡信箱」，則應改名為 `contact_email_at_signup` 並註明是快照。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.ssot_semantic@dim_customer（本主體） vs CRM 客戶主檔
    question: "同一個客戶實體在本主體與 CRM 各有一張表，看起來有兩個權威擁有者候選——SSOT 登錄上要把誰記為權威？"
    answer: "唯一權威是 CRM 的客戶主檔；本主體的 `dim_customer` 登錄為副本（replica），不進 SSOT registry 的權威欄位。建議晉升前先確認 CRM 主檔已在 production，再以三段式引用取代本地副本。"
    kind: structural
    status: proposed
    applied_to: "config/Common/ssot/registry.yaml"
  - id: SKILL.ssot_semantic@subscription.MonthlyPrice vs billing_event.amount
    question: "月費與實際計費金額是兩份金額事實——對帳出現差異時（例如首月比例計費、折扣、退款），要以哪一邊為準？差異要記在哪裡？"
    answer: "實收以 `billing_event.amount` 為權威（它對應金流實際發生的交易）；`monthly_price` 只是應收基準。差異原因（比例計費、折扣、退款）應由 `billing_event` 的事件類型與折扣欄位交代，不在訂閱表回寫。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@subscription.subscription_id
    question: "`subscription_id` 識別的是「一份訂閱合約」還是「合約的一個版本」？客戶升級方案時，是沿用同一個 id，還是產生新的一筆？"
    answer: "`subscription_id` 識別一份合約（跨版本穩定）；方案變更以同一筆更新處理。若日後需要保留方案變更歷史，應另建 `subscription_plan_history` 事件表，而非改變本欄語意。"
    kind: semantic
    status: proposed
  - id: CONCEPT.SUBJECT@subscription（方案變更）
    question: "粒度說「一行 = 一筆訂閱（含歷史訂閱）」——那客戶從月繳升級成年繳、或換方案時，是改這一列的月費，還是結束舊列、開一列新的？"
    answer: "方案變更以同一列更新處理（合約 id 穩定），變更前的計費事實由 `billing_event` 保留，因此歷史營收不會被改寫。建議把這個規則寫進 context.md 的粒度段落。"
    kind: semantic
    status: proposed
  - id: SKILL.best_practice_semantic@billing_event（遲到資料與封帳）
    question: "計費事件常有補登與延遲入帳——月結報表出完之後才到的事件，要回頭修正已出的月份，還是計入下一期？這個規則寫在哪裡？"
    answer: "建議定義封帳日（例如次月 5 日），封帳前的遲到事件回補原月份、封帳後一律計入當期並保留調整軌跡；此規則寫進 context.md，並作為 ETL 重跑視窗的依據。"
    kind: semantic
    status: proposed
  - id: SKILL.naming_semantic@billing_event.event_id
    question: "`event_id` 是本 schema 裡唯一沒有帶主體前綴的識別碼（另兩個是 `customer_id`、`subscription_id`）——之後與其他來源的事件表整合時，這個名字還能指認它是計費事件嗎？"
    answer: "建議更名為 `billing_event_id`，與表名及其他識別碼的命名慣例一致；若下游已大量引用 `event_id`，可先在詞彙字典登錄別名對應再排期更名。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.ssot_semantic@billing_event.amount（幣別）
    question: "計費金額沒有幣別欄，訂閱表也沒有——目前是假設全部是同一種幣別嗎？若之後開放海外訂閱，既有資料要怎麼補回幣別？"
    answer: "目前全部為 TWD。建議即使只有單一幣別，也在兩張金額表加上 `currency` 欄並回填 `TWD`，避免未來擴張時無法辨識既有資料的幣別。"
    kind: structural
    status: proposed
    applied_to: "subscription.sql"
  - id: SKILL.ssot_semantic@dim_customer.customer_tier（過渡期權威）
    question: "前一輪確認本表是 CRM 的唯讀副本——但在 CRM 客戶主檔還沒晉升 production 之前，實務上大家只查得到這份副本。這段過渡期要怎麼避免它被當成權威使用？"
    answer: "過渡期以文件約束為主：在 context.md 與表 COMMENT 標明「CRM 副本、僅供本主體 join 使用、不得對外提供客戶屬性」，並把 CRM 主檔晉升列為本主體晉升的前置條件。"
    kind: semantic
    status: proposed
  - id: PRODUCTION.REUSE@subscription
    question: "【正式區複用】subscription 目前沒有引用任何正式區資產（現有 `CRM.dim_customer`、`CRM.order`）——是這些主體都沒有你要的事實，還是漏了該建立的引用？"
    answer: "（請擇一交代）① 確實無上游：本主體是源頭資料，正式區沒有可複用的既有事實；② 漏了引用：請補進 relations.yaml 的三段式端點後改為 structural 並重跑。"
    kind: semantic
    status: proposed
