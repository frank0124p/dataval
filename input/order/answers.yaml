#       不想追了 → 改為 deferred。只有 answered 計入收斂與下一輪 prompt。
# structural 條目請先手動修改權威輸入（input/order/ 的 .sql／relations.yaml／context.md）再改 answered，並確認 applied_to。
version: 1
iteration: 2
answers:
  - id: NAME.SEMANTIC@orders.total_amount
    question: "total_amount 的註解說明是「含稅、下單當下快照值」，但名稱本身看不出含稅與快照語意——下游在計算未稅營收或與商品現價比對時，是否可能誤用？要不要在詞彙字典（config/<域>/naming）登錄這個欄位的權威定義？"
    answer: "維持欄名 total_amount，但在 naming 詞彙字典登錄定義：「訂單總金額＝含稅、下單當下快照，與商品主檔現價無關」，並要求下游計算未稅金額時另行換算。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@order_items.unit_price
    question: "unit_price 是「下單當下快照」，與商品主檔的現價欄位若同名，下游 join 之後是否容易混淆兩者？是否考慮以命名（如 snapshot／dealt 字樣）或詞彙字典明確區分？"
    answer: "維持 unit_price 欄名（業界慣例為成交價），在詞彙字典標注「order_items.unit_price＝成交快照價；商品現價以商品主檔為準」，避免下游誤當現價使用。"
    kind: semantic
    status: answered
  - id: CONCEPT.SUBJECT@orders
    question: "訂單的「取消」同時由 status=cancelled 與 cancelled_at 兩個欄位表達——寫入端是否保證兩者一致（status 為 cancelled 時 cancelled_at 必非 NULL，反之亦然）？下游應以哪個欄位為取消判定的權威？"
    answer: "以 status 為取消判定權威、cancelled_at 僅補充取消時間；由結帳服務保證兩欄同交易寫入，並在 context.md 記載此約定。"
    kind: semantic
    status: answered
  - id: CONCEPT.SUBJECT@order_items
    question: "context 說「同一商品在同一訂單內只會有一行」，這代表 (order_id, product_id) 具唯一性——business key 目前登錄的是代理鍵 order_item_id，是否要把 (order_id, product_id) 一併宣告為自然鍵，讓重複檢查有依據？"
    answer: "在 context.md 的 business_keys 補登 order_items: [order_id, product_id]（自然鍵），order_item_id 保留為代理識別。"
    kind: structural
    status: proposed
    applied_to: "context.md"
  - id: SKILL.best_practice_semantic@orders.total_amount
    question: "orders 是交易事實表，total_amount 是明細加總的快照——是否已有對帳機制（批次或檢核報表）驗證它與 order_items 的 quantity × unit_price 加總一致？允許的誤差（折扣、運費、稅）記載在哪裡？"
    answer: "total_amount 允許與明細加總不同（含稅與整單折扣攤提在頭表），由結帳服務保證寫入時一致；建議另建日批對帳報表監控差異。"
    kind: semantic
    status: answered
  - id: SKILL.best_practice_semantic@order_items
    question: "幣別 currency 只存在 orders 頭表——明細層要計算金額時必須 join 回頭表取幣別，這是刻意的正規化設計嗎？跨幣別分析的使用情境是否已確認可接受這個 join 成本？"
    answer: "是刻意設計：同一訂單必為單一幣別，幣別屬訂單層事實；下游明細分析一律以 order_id join 回 orders 取 currency。"
    kind: semantic
    status: answered
  - id: SKILL.naming_semantic@orders.ordered_at
    question: "ordered_at（業務發生時間）與 created_at（資料建立時間）並存——兩者的差異語意（event time vs ingest time）是否已在詞彙字典明文化，確保營收日報一律以 ordered_at 彙總、稽核追查才用 created_at？"
    answer: "已依 context 約定：營收與對帳一律以 ordered_at（event time）為準；created_at／updated_at 僅稽核用。建議在 naming 詞彙字典補登此約定。"
    kind: semantic
    status: answered
  - id: SKILL.ssot_semantic@order_items.unit_price
    question: "unit_price 是刻意反正規化的成交快照，商品現價權威在商品主檔——這條「同名不同權威」的邊界是否已登錄到 SSOT 文件（config/<域>/ssot），避免未來有人把 order_items 當成價格權威來源？"
    answer: "在 SSOT 文件登錄：價格權威＝商品主檔；order_items.unit_price 為成交快照、僅供交易重現與對帳，不得作為現價來源。"
    kind: semantic
    status: answered
  - id: CONCEPT.SUBJECT@derivation.sql
    question: "衍生 SQL 以 orders LEFT JOIN order_items 展開後，寬表粒度變成「訂單 × 商品項」，且無明細的訂單也會留下一列（明細欄全 NULL）——下游對 total_amount 彙總時是否已意識到同一訂單會重複出現多列（每個品項一列）、直接 SUM 會重複計算頭表金額？"
    answer: "寬表粒度定義為「訂單 × 商品項」；訂單層指標（total_amount 等）一律先以 order_id 去重（或改查 orders 頭表）再彙總，無明細訂單保留（NULL 品項欄）以維持訂單母體完整。此口徑補記於 context.md。"
    kind: semantic
    status: answered
  - id: CONCEPT.SUBJECT@dim_customer
    question: "衍生 SQL join 進 dim_customer 的 customer_name／customer_tier 是「查詢當下的現值」——這與 unit_price 採「下單當下快照」的策略相反。以 customer_tier 做歷史訂單分析時，會拿到客戶現在的等級而非下單當時的等級，這是刻意的嗎？"
    answer: "刻意設計：客戶屬性採現值（維度表直接 join），僅交易金額採快照；需要「下單當時等級」的分析應另建 SCD2 客戶維度，本寬表不承諾歷史屬性。此語意補記於 context.md。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@orders.status
    question: "`status` 目前承載訂單生命週期（created/paid/shipped/cancelled），其中 `paid` 屬於金流語意、`shipped` 屬於物流語意——單一欄位混合多條狀態軸，未來要新增「退款中」「部分出貨」時是否還能表達？"
    answer: "目前階段維持單一 `status` 即可（訂單生命週期是線性的）；若之後出現金流與物流同時演進的需求，再拆成 `order_status` ＋ `payment_status` ＋ `fulfillment_status` 三欄，並在 context.md 記錄拆分時機。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@orders.ordered_at / orders.created_at / orders.updated_at
    question: "三個時間欄中 `ordered_at` 是業務發生時間、`created_at`／`updated_at` 是稽核時間，但命名形式相同（都是 `_at`）——分析師只看欄名能分辨哪個可以拿來做營收歸期嗎？"
    answer: "維持現有欄名（`_at` 是專案慣例），但在 context.md 的「用途與消費者」明確寫死「營收彙總一律以 `ordered_at` 為準，`created_at`／`updated_at` 僅供稽核與增量抽取」，並在 ETL／BI 語意層設為預設時間欄。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@order_items.product_id
    question: "`customer_id` 的註解明確指出權威在 `CRM.dim_customer`，但 `product_id` 只寫「權威在商品主檔」而沒有指名 domain 與表——這個商品主檔在哪個領域、叫什麼名字？"
    answer: "商品主檔權威預期在 SCM 領域（例如 `SCM.dim_product`），但該 subject 目前尚未晉升進 production。建議先在 `product_id` 的 COMMENT 與 context.md 寫明預期權威位置，待商品主檔晉升後再於 relations.yaml 補上三段式宣告。"
    kind: structural
    status: proposed
    applied_to: "order.sql"
  - id: CONCEPT.SUBJECT@order（未登錄主體候選）
    question: "`orders` 與 `order_items` 承載的「訂單」「訂單明細」概念目前不在 SSOT 登錄表內——這兩個主體的權威擁有者是本 subject 嗎？要不要順手登錄，讓之後的跨域引用有依據？"
    answer: "是，訂單與訂單明細的權威擁有者就是本 subject。建議晉升進 production 後，於 `config/CRM/ssot/registry.yaml` 登錄 `order` → `orders`、`order_item` → `order_items`。"
    kind: structural
    status: proposed
    applied_to: "config/CRM/ssot/registry.yaml"
  - id: SKILL.best_practice_semantic@orders.ordered_at
    question: "訂單是持續累積的時間序列事實，但目前沒有看到分區宣告——資料量成長後，營收日報依 `ordered_at` 掃描的成本是否還可接受？"
    answer: "建議加 `PARTITION BY toYYYYMM(ordered_at)`（月分區，與月結批次的重跑單位一致），排序鍵可再評估改為 `(ordered_at, order_id)` 以利時間範圍裁剪。"
    kind: structural
    status: proposed
    applied_to: "order.sql"
  - id: SKILL.naming_semantic@orders.customer_id / dim_customer.customer_id
    question: "衍生 SQL 把 `dim_customer.customer_id` 另取別名 `dim_customer_customer_id` 輸出——寬表裡同時出現兩個客戶鍵，讀的人分得出哪個是本表的鍵、哪個是 join 進來的嗎？"
    answer: "寬表只保留 `orders.customer_id` 一個客戶鍵，`dim_customer_customer_id` 屬於 join 驗證用的暫時欄，建議從最終的寬表 SELECT 清單移除。"
    kind: structural
    status: proposed
    applied_to: "derivation.sql"
  - id: SKILL.naming_semantic@order_items.quantity
    question: "`quantity` 的註解寫「單位：件」，但商品若有以重量或長度計價的品項，這個欄名與單位假設還成立嗎？是否需要一個 `unit_of_measure`？"
    answer: "目前商品皆以「件」計價，維持現狀即可；若導入計重／計長商品，再新增 `unit_of_measure` 欄並回填既有資料為 `piece`。建議把這個前提寫進 context.md。"
    kind: semantic
    status: answered
  - id: SKILL.ssot_semantic@derivation.sql（customer_name、customer_tier）
    question: "context 明確宣告「只存鍵不存客戶屬性」，但衍生 SQL 把 `customer_name`、`customer_tier` join 進寬表——這份寬表若被物化保存，是不是就等於在本領域複製了 CRM 的權威屬性？"
    answer: "這張寬表定位為查詢期的 view／臨時結果，不物化落地，因此不構成權威複製。若之後要物化，需在 context.md 註明快照語意（客戶屬性為當時值）並定義刷新頻率。"
    kind: semantic
    status: answered
  - id: SKILL.ssot_semantic@order_items.product_id
    question: "`product_id` 指向的商品主檔目前不在任何已晉升的 domain 內——這個 join key 能保證與未來的商品主檔指向同一實體（同編碼、同型別）嗎？"
    answer: "商品編碼沿用來源系統的商品主鍵（整數、全域唯一），與未來 `SCM.dim_product.product_id` 同源。建議商品主檔晉升時立即補 relations.yaml 三段式宣告，讓引擎做型別相容實檢。"
    kind: semantic
    status: answered
  - id: SKILL.ssot_semantic@orders.currency
    question: "`currency` 存在訂單層級，但 `order_items.unit_price` 沒有幣別欄——明細金額的幣別是隱含沿用訂單的嗎？跨幣別報表彙總時，這個隱含關係看得出來嗎？"
    answer: "是，明細幣別一律沿用所屬訂單的 `orders.currency`（一張訂單不會混幣）。建議把這條不變式寫進 context.md，並要求所有金額彙總必須先 join 訂單取幣別或先換算為本位幣。"
    kind: semantic
    status: answered
  - id: NAME.SEMANTIC@orders.cancelled_at
    question: "`cancelled_at` 是本 schema 唯一可為 NULL 的欄位，NULL 同時代表「尚未取消」——但「訂單已取消卻沒記到時間」也會是 NULL。這兩種情況在查詢時分得開嗎？"
    answer: "以 `status = 'cancelled'` 為取消判定權威（前一輪已確認），因此 `cancelled_at IS NULL 且 status = 'cancelled'` 就是資料品質異常。建議把這條不變式做成日批檢核，而非改變欄位設計。"
    kind: semantic
    status: proposed
  - id: NAME.SEMANTIC@order_items.order_item_id
    question: "`order_item_id` 是來源系統給的自然鍵，還是 ETL 端產生的代理鍵？如果訂單重送或明細重算，同一個商品項會拿到同一個 id 嗎？"
    answer: "`order_item_id` 是結帳服務產生的來源穩定識別碼，重送同一筆明細會沿用同一個 id。建議把這個穩定性保證寫進 context.md，作為下游可安全 upsert 的依據。"
    kind: semantic
    status: proposed
  - id: CONCEPT.SUBJECT@orders（取消單的母體語意）
    question: "前一輪確認營收彙總會排除取消訂單——那「下單量」「轉換率」這類母體型指標呢？取消單要算進分母嗎？"
    answer: "下單量等母體型指標**包含**取消單（下單行為確實發生），只有金額型指標排除；建議在 context.md 分開寫這兩條口徑，避免下游把營收的過濾條件套用到母體。"
    kind: semantic
    status: proposed
  - id: CONCEPT.SUBJECT@orders（部分退貨／換貨）
    question: "`status` 只能表達整單取消，但實務上會有「退其中一個品項」——這類部分退貨的事實目前由哪個主體承載？本主體要不要負責？"
    answer: "部分退貨屬於獨立的售後事實，應由另一個主體（退貨／退款事件表）承載，本主體維持下單當下快照、不回寫金額。建議在 context.md 的領域邊界明寫「本主體不承載退貨」。"
    kind: semantic
    status: proposed
  - id: SKILL.best_practice_semantic@orders.cancelled_at（Nullable 欄位策略）
    question: "`cancelled_at` 是唯一使用 Nullable 的欄位——在 ClickHouse 中 Nullable 會多一個 null map、影響壓縮與掃描效能。這個成本在資料量放大後可接受嗎？"
    answer: "目前僅一欄、且取消是低頻事件，維持 Nullable 可接受（語意最清楚）。建議設一條慣例：只有「業務上真的可能不存在」的時間欄才用 Nullable，其餘一律 NOT NULL＋預設值。"
    kind: semantic
    status: proposed
  - id: SKILL.naming_semantic@orders / order_items（表名與 SSOT 主體名）
    question: "表名用複數（`orders`、`order_items`），SSOT 的主體候選卻是單數（`order`、`order_item`）——這組單複數對應是專案慣例嗎？有寫在詞彙字典裡讓後續 subject 照做嗎？"
    answer: "慣例為「主體名單數、表名複數」。建議在 `config/CRM/naming/` 的詞彙字典明文登錄這條規則，讓後續 subject 有依據可循。"
    kind: structural
    status: proposed
    applied_to: "config/CRM/naming/"
  - id: SKILL.ssot_semantic@orders.currency（換算基準）
    question: "前一輪確認一張訂單只有單一幣別——那跨幣別的營收合計要換算成本位幣時，匯率來自哪裡？這份匯率事實的權威擁有者是誰？"
    answer: "匯率不屬於本主體，權威應在財務領域的匯率主檔；營收換算一律以「下單日匯率」為準。建議在 context.md 註明此依賴，待匯率主檔晉升後於 relations.yaml 補宣告。"
    kind: semantic
    status: proposed
  - id: SKILL.ssot_semantic@orders.total_amount（對外請款金額）
    question: "前一輪確認 `total_amount` 是金流實際請款金額的權威——那金流平台自己那份交易金額算什麼？兩邊不一致時，對外（例如客服、發票）要以誰為準？"
    answer: "對外一律以金流平台的交易紀錄為最終權威（它是真正扣款的系統）；本表的 `total_amount` 是請款當下的快照，用於分析與差異偵測。建議在 context.md 明寫這個優先序。"
    kind: semantic
    status: proposed
  - id: SKILL.production_reuse_semantic@orders / order_items（本主體已在正式區）
    question: "正式區的 `CRM.order` 就是本主體的已核准版本——這次 input 是既有主體的改版，不是新建。變更相對正式區版本的差異，下游（營收日報、對帳、出貨）已經評估過影響了嗎？"
    answer: "本次改版與正式區版本的差異僅在補充註解與 relations 宣告，欄位與粒度不變，下游不受影響。若之後要動欄位，先以 PRODGRAPH.IMPACT 的依賴清單逐一確認。"
    kind: semantic
    status: proposed
  - id: SKILL.production_reuse_semantic@orders.customer_id → CRM.dim_customer
    question: "本主體已用三段式引用客戶主檔（`CRM.dim_customer`），這是正確的複用。反過來看：正式區的 `CRM.dim_customer` 有沒有哪些屬性是本主體其實需要、但目前是靠下游自己 join 取得的？要不要在 context 明寫「客戶屬性一律 join 主檔取得」的使用約定？"
    answer: "是，建議在 context.md 的「用途與消費者」補一句：客戶屬性（姓名、等級、聯絡方式）一律以 customer_id join `CRM.dim_customer` 取得，本主體與其下游都不得自行複製。"
    kind: semantic
    status: proposed
