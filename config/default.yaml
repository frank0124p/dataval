# Default configuration.
# Domain skills 在 config/domain/，Python 規則在 config/rules/。
# 這裡只放 SSOT registry。

ssot:
  join_key_suffixes: ["_id"]
  shared_columns_ok: [status, name, type]   # columns allowed to recur w/o being an SSOT violation
  # registry: each business entity's single authoritative owner
  registry:
    customer:
      authoritative_table: dim_customer
      key: customer_id
      attributes: [customer_name, customer_email, customer_tier]
      domains: [crm, billing]
    product:
      authoritative_table: dim_product
      key: product_id
      attributes: [product_name, product_category, list_price]
      domains: [catalog, billing]
  # attribute -> table that owns the canonical value
  attribute_owner:
    customer_email: dim_customer
    list_price: dim_product
