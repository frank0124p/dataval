# 詞彙字典（business glossary）— naming 字典卡控的依據。
# 這份清單獨立於 skill 與 registry（三份權威清單各自獨立）。
# 用 SKILL 的 require: term_in_glossary / no_banned_term 來對照。

# 禁用詞 → 建議改用的標準詞（欄位名若含左邊的詞就報違規）
banned_terms:
  cust: customer
  usr: user
  qty: quantity
  amt: amount
  dt: date
  ts: timestamp
  num: number
  desc: description
  addr: address

# 別名 → 正規詞（同義但非標準的寫法）
aliases:
  client: customer
  buyer: customer
  member: customer
  goods: product
  item: product           # 視情境，PLM 的 item 可在 domain 字典覆寫
  sku: product

# 認可的標準詞（term_in_glossary 會檢查欄位用詞是否都在這裡；
# 留空代表不啟用「白名單」模式，只用 banned/aliases 黑名單）
standard_terms: []
